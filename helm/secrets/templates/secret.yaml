{{- if not .Values.encryption.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secrets.fullname" . }}-keys
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
  annotations:
    # The keys must outlive the release: deleting them makes the stored data
    # unreadable, so Helm is told to leave this object alone on uninstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  master-key: {{ include "secrets.masterKey" . | b64enc | quote }}
  jwt-secret: {{ include "secrets.jwtSecret" . | b64enc | quote }}
{{- end }}
