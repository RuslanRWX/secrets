{{- if .Values.networkPolicy.enabled }}
{{- if .Values.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "secrets.postgresqlFullname" . }}
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "secrets.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgresql
  policyTypes:
    - Ingress
  ingress:
    # Only the API may reach the database.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "secrets.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "secrets.fullname" . }}-api
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "secrets.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    # The API is reached through the UI pods, never directly from outside.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "secrets.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: ui
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
