apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secrets.fullname" . }}-api
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "secrets.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "secrets.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        {{- /*
          Changing a Secret's contents does not restart pods on its own, so the
          key material is fingerprinted here: a rotated key rolls the API, and
          an unchanged key leaves it alone. Skipped when the Secret is managed
          outside the chart, since its contents are not visible here.
        */}}
        {{- if not .Values.encryption.existingSecret }}
        checksum/keys: {{ printf "%s|%s" (include "secrets.masterKey" .) (include "secrets.jwtSecret" .) | sha256sum }}
        {{- end }}
        {{- include "secrets.rolloutAnnotation" (dict "tag" (include "secrets.apiTag" .) "revision" .Release.Revision) | nindent 8 }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "secrets.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "secrets.apiImage" . | quote }}
          imagePullPolicy: {{ include "secrets.apiPullPolicy" . }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: {{ .Values.api.logLevel | quote }}
            - name: SESSION_TTL
              value: {{ .Values.api.sessionTTL | quote }}
            - name: TRUST_PROXY_HEADERS
              value: "true"
            {{- with .Values.api.corsOrigins }}
            - name: CORS_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets.keySecretName" . }}
                  key: master-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets.keySecretName" . }}
                  key: jwt-secret
            {{- if .Values.postgresql.enabled }}
            - name: POSTGRES_HOST
              value: {{ include "secrets.postgresqlFullname" . }}
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_SSLMODE
              value: "disable"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "secrets.postgresqlFullname" . }}
                  key: password
            {{- else }}
            - name: POSTGRES_HOST
              value: {{ .Values.externalDatabase.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.externalDatabase.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.externalDatabase.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.externalDatabase.username | quote }}
            - name: POSTGRES_SSLMODE
              value: {{ .Values.externalDatabase.sslmode | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret | default (printf "%s-db" (include "secrets.fullname" .)) }}
                  key: {{ .Values.externalDatabase.passwordKey }}
            {{- end }}
          # The API waits for PostgreSQL before it starts listening. The
          # startup probe gives it that time without the liveness probe
          # killing the pod during a cold start.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "secrets.fullname" . }}-api
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "secrets.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
{{- if not .Values.externalDatabase.existingSecret }}
{{- if not .Values.postgresql.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secrets.fullname" . }}-db
  labels:
    {{- include "secrets.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.externalDatabase.passwordKey }}: {{ .Values.externalDatabase.password | b64enc | quote }}
{{- end }}
{{- end }}
