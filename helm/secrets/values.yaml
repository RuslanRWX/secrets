# Default values for the secrets chart.

nameOverride: ""
fullnameOverride: ""

image:
  registry: docker.io

  # The version of the application to run. This is the only line you need to
  # touch to upgrade:
  #
  #   helm upgrade secrets ./helm/secrets --set image.tag=0.3.0
  #
  # Set it to "latest" to track the newest release. On a moving tag the chart
  # pulls on every start and rolls the pods on every `helm upgrade`, so an
  # upgrade actually picks up the new build. Pin a version for production.
  #
  # Leave empty to use the chart's appVersion.
  tag: ""

  # Empty means: Always for a moving tag, IfNotPresent for a pinned one.
  pullPolicy: ""

  pullSecrets: []

  # The API and the web UI ship as separate images. Override tag or pullPolicy
  # here only when the two need to differ, such as testing one of them.
  api:
    repository: ruslanrwx/secrets-api
    tag: ""
    pullPolicy: ""
  ui:
    repository: ruslanrwx/secrets-ui
    tag: ""
    pullPolicy: ""

encryption:
  # The key every secret is encrypted with. Leave empty and the chart generates
  # one on first install and reuses it on every upgrade.
  #
  # Losing this key means losing every stored secret. Copy it somewhere safe:
  #   kubectl get secret <release>-keys -o jsonpath='{.data.master-key}' | base64 -d
  masterKey: ""
  # Signs session tokens. Changing it signs everyone out; nothing is lost.
  jwtSecret: ""
  # Use a Secret you manage yourself instead. It must contain the keys
  # master-key and jwt-secret.
  existingSecret: ""

api:
  replicaCount: 2
  sessionTTL: 12h
  logLevel: info
  # Set when the UI is served from a different origin than the API.
  corsOrigins: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ui:
  replicaCount: 2
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: secrets.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

# A single-replica PostgreSQL for evaluation and small installations. Point the
# chart at a managed database for anything that matters.
postgresql:
  enabled: true
  image: postgres:16-alpine
  database: secrets
  username: secrets
  # Generated on first install when left empty.
  password: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# Used when postgresql.enabled is false.
externalDatabase:
  host: ""
  port: 5432
  database: secrets
  username: secrets
  password: ""
  sslmode: require
  # A Secret holding the password under the key given by passwordKey.
  existingSecret: ""
  passwordKey: password

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: false

podDisruptionBudget:
  enabled: false
  minAvailable: 1
